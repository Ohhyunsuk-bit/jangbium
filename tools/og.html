<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200, initial-scale=1">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: linear-gradient(135deg, #1f6f8b 0%, #14485a 100%);
    color: #fff; font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    display: flex; flex-direction: column; justify-content: center; padding: 0 96px; box-sizing: border-box;
  }
  .brand { font-size: 40px; opacity: 0.85; letter-spacing: 0.02em; }
  h1 { font-size: 84px; line-height: 1.15; margin: 18px 0 26px; font-weight: 800; }
  p { font-size: 36px; margin: 0; opacity: 0.9; }
</style>
</head>
<body>
  <div class="brand">장비움 · 장정결 스케줄러</div>
  <h1>검사 시간만 넣으면<br>복용 시간표가 나옵니다</h1>
  <p>쿨프렙 · 오라팡 · 플렌뷰 — 캘린더 저장, 카톡 공유</p>
</body>
</html>
