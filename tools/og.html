<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200, initial-scale=1">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: radial-gradient(90% 70% at 30% 0%, #4a3521 0%, #17110d 75%);
    color: #f1e6d4; font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    display: flex; flex-direction: column; justify-content: center; padding: 0 96px; box-sizing: border-box;
  }
  .brand { font-size: 40px; color: #dca960; letter-spacing: 0.02em; }
  h1 { font-size: 84px; line-height: 1.15; margin: 18px 0 26px; font-weight: 800; color: #f7ecd9; }
  p { font-size: 36px; margin: 0; color: #cbb79c; }
</style>
</head>
<body>
  <div class="brand">장비움 · 장정결 스케줄러</div>
  <h1>검사 시간만 넣으면<br>복용 시간표가 나옵니다</h1>
  <p>쿨프렙 · 오라팡 · 플렌뷰 — 캘린더 저장, 카톡 공유</p>
</body>
</html>
